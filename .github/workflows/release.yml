# The engine binaries (nslm-chat, nslm-serve) for Windows x64 and Linux x64 (CUDA 12.8) and macOS (Metal), as a GitHub
# release draft (tag v + VERSION) that follows main: a change of the sources, the start scripts or VERSION rebuilds it.
# Publishing the draft on the releases page makes its tag. After that nothing is built until VERSION changes.
name: release
on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml, start/**, tools/release-readme.txt, engine/**, harness/**, nslm/**, win/**,
            CMakeLists.txt, Makefile]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0 (empty: v + VERSION)"
        required: false
      draft:
        description: "Keep the release as a draft"
        type: boolean
        default: true
permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs: {tag: "${{ steps.t.outputs.tag }}", build: "${{ steps.t.outputs.build }}"}
    steps:
      - uses: actions/checkout@v4
      - id: t
        env: {INPUT_TAG: "${{ inputs.tag }}", GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}"}
        run: |
          t=${INPUT_TAG:-v$(tr -d ' \r\n' < VERSION)}
          echo "$t" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad tag $t"; exit 1; }
          echo "tag=$t" >> "$GITHUB_OUTPUT"
          if [ "$(gh release view "$t" --json isDraft -q .isDraft 2>/dev/null)" = false ]; then
            echo "$t is published: nothing to build (change VERSION for a new release)"; echo "build=no" >> "$GITHUB_OUTPUT"
          else echo "build=yes" >> "$GITHUB_OUTPUT"; fi

  linux:
    needs: meta
    if: needs.meta.outputs.build == 'yes'
    env: {TAG: "${{ needs.meta.outputs.tag }}"}
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04   # glibc 2.35
    timeout-minutes: 60
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git libicu-dev python3-pip >/dev/null && pip3 install -q cmake ninja
      - uses: actions/checkout@v4
      - name: build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNSLM_STATIC_ICU=ON   # GCC: the CPU seed path is a stub, as with MSVC
          cmake --build build --target nslm-chat nslm-serve
          ldd build/bin/nslm-serve
          if ldd build/bin/nslm-serve | grep -q icu; then echo "ICU is not static"; exit 1; fi
          rc=0; build/bin/nslm-serve >/dev/null 2>&1 || rc=$?; test "$rc" = 2   # the usage: the binary starts
      - name: package
        run: |
          d=nslm-$TAG-linux-x64-cuda12.8
          mkdir -p "$d/build/bin" && cp build/bin/nslm-chat build/bin/nslm-serve "$d/build/bin/" && cp LICENSE start/start-here.sh "$d/"
          sed "s/@TAG@/$TAG/; s/@SHA@/$GITHUB_SHA/" tools/release-readme.txt > "$d/README.txt"
          tar -czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with: {name: linux, path: "nslm-*.tar.gz"}

  windows:
    needs: meta
    if: needs.meta.outputs.build == 'yes'
    env: {TAG: "${{ needs.meta.outputs.tag }}"}
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: CUDA 12.8 and Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest https://developer.download.nvidia.com/compute/cuda/12.8.1/network_installers/cuda_12.8.1_windows_network.exe -OutFile cuda.exe
          $p = Start-Process .\cuda.exe -ArgumentList '-s', 'nvcc_12.8', 'cudart_12.8', 'visual_studio_integration_12.8' -Wait -PassThru
          if ($p.ExitCode) { throw "the CUDA installer returned $($p.ExitCode)" }
          $c = "$env:ProgramFiles\NVIDIA GPU Computing Toolkit\CUDA\v12.8"
          "CUDA_PATH=$c" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$c\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
      - name: build
        shell: cmd
        env:
          NSLM_CMAKE_ARGS: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
        run: win\build.bat
      - name: smoke test
        shell: cmd
        run: |
          build\bin\nslm-serve.exe > serve.log 2>&1
          set rc=%errorlevel%
          type serve.log
          echo nslm-serve exit code %rc% (2: the usage, so the binary starts)
          if not "%rc%"=="2" exit /b 1
      - name: package
        shell: pwsh
        run: |
          $d = "nslm-$env:TAG-windows-x64-cuda12.8"
          New-Item -ItemType Directory "$d\build\bin" | Out-Null
          Copy-Item build\bin\nslm-chat.exe, build\bin\nslm-serve.exe "$d\build\bin\"
          Copy-Item LICENSE, start\START-HERE.bat, start\start-here.ps1 $d
          (Get-Content tools\release-readme.txt) -replace '@TAG@', $env:TAG -replace '@SHA@', $env:GITHUB_SHA | Set-Content "$d\README.txt"
          Get-ChildItem -Recurse $d | ForEach-Object { Write-Host $_.FullName $_.Length }
          Compress-Archive -Path $d -DestinationPath "$d.zip"
          Get-Item "$d.zip" | ForEach-Object { Write-Host $_.Name $_.Length }
      - uses: actions/upload-artifact@v4
        with: {name: windows, path: "nslm-*.zip"}

  macos:
    needs: meta
    if: needs.meta.outputs.build == 'yes'
    runs-on: macos-26   # the macOS 26 SDK (Metal 4, behind @available)
    timeout-minutes: 60
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      MACOSX_DEPLOYMENT_TARGET: "15.0"   # Metal 3.2
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          xcrun -sdk macosx metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          make out/bin/nslm-chat out/bin/nslm-serve out/res/kernels_moe.metallib out/res/kernels_qwen4.metallib
          otool -L out/bin/nslm-serve
          rc=0; out/bin/nslm-serve >/dev/null 2>&1 || rc=$?; test "$rc" = 2
      - name: sign and notarize   # Developer ID and Apple's notary: Gatekeeper accepts a browser download
        # The Developer ID Application certificate expires on 2027-02-01: then renew MACOS_CERT_P12 and MACOS_CERT_PASSWORD
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}                 # base64 of the Developer ID Application .p12
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}           # the text of the App Store Connect AuthKey_*.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$P12" ]; then echo "No signing secrets: the binaries stay ad-hoc signed"; exit 0; fi
          t=$RUNNER_TEMP k=$RUNNER_TEMP/sign.keychain-db kp=$(uuidgen)
          printf '%s' "$P12" | base64 -d > "$t/id.p12" && printf '%s\n' "$NOTARY_KEY" > "$t/key.p8"
          security create-keychain -p "$kp" "$k" && security set-keychain-settings -lut 3600 "$k"
          security unlock-keychain -p "$kp" "$k"
          security import "$t/id.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$k"
          security set-key-partition-list -S apple-tool:,apple: -k "$kp" "$k" >/dev/null
          security list-keychains -d user -s "$k"
          id=$(security find-identity -v -p codesigning "$k" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          test -n "$id" || { echo "no Developer ID Application identity in MACOS_CERT_P12"; exit 1; }
          codesign --force --options runtime --timestamp --keychain "$k" --sign "$id" out/bin/nslm-chat out/bin/nslm-serve
          codesign --verify --strict --verbose=2 out/bin/nslm-serve
          ditto -c -k --keepParent out/bin "$t/bin.zip"
          r=$(xcrun notarytool submit "$t/bin.zip" --key "$t/key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
              --wait --timeout 30m --output-format json) || true   # an Invalid result is reported below
          echo "$r"
          rm -f "$t/id.p12" "$t/key.p8"
          echo "$r" | grep -q '"status" *: *"Accepted"' || { echo "notarization was not accepted"; exit 1; }
          for i in 1 2 3 4 5 6; do   # Gatekeeper reads the ticket online, which can lag the notary by a minute
              spctl --assess --type open --context context:primary-signature -v out/bin/nslm-serve && break
              [ "$i" = 6 ] && { echo "Gatekeeper rejects the notarized nslm-serve"; exit 1; }; sleep 20
          done
          rc=0; out/bin/nslm-serve >/dev/null 2>&1 || rc=$?; test "$rc" = 2   # the signed binary starts
      - name: package
        run: |
          d=nslm-$TAG-macos-arm64-metal
          mkdir -p "$d/out/bin" "$d/out/res"
          cp out/bin/nslm-chat out/bin/nslm-serve "$d/out/bin/" && cp out/res/kernels_moe.metallib out/res/kernels_qwen4.metallib "$d/out/res/"
          cp LICENSE start/start-here.sh "$d/" && sed "s/@TAG@/$TAG/; s/@SHA@/$GITHUB_SHA/" tools/release-readme.txt > "$d/README.txt"
          tar -czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with: {name: macos, path: "nslm-*.tar.gz"}

  release:
    needs: [meta, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRAFT: ${{ github.event_name == 'push' || inputs.draft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - name: publish
        run: |
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = false ]; then echo "$TAG is published: change VERSION"; exit 1; fi
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          sed "s/@TAG@/$TAG/; s/@SHA@/$GITHUB_SHA/" tools/release-readme.txt > notes.txt
          gh release view "$TAG" >/dev/null 2>&1 ||
              gh release create "$TAG" --target "$GITHUB_SHA" --title "NanoSeedLM engine $TAG" --notes-file notes.txt --prerelease --draft
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file notes.txt --draft="$DRAFT"   # the tag and notes of this build
