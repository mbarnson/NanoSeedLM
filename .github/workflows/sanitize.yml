# The tests under AddressSanitizer, UndefinedBehaviorSanitizer and LeakSanitizer (-DNSLM_SANITIZE=ON) on each push. The
# runner has no GPU, so the GPU tests skip (exit 77) and the host code runs: the parsers, the server, the C references.
name: sanitize
on:
  push:
    branches: [main, 'claude/**', 'mac/**']
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    timeout-minutes: 60
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git libicu-dev cmake ninja-build >/dev/null
      - uses: actions/checkout@v4
      - name: build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNSLM_SANITIZE=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build
      - name: ctest
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:protect_shadow_gap=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure
